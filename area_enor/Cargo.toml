[package]
name = "area_enor"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ENOR (Polaris/Norway FIR) area plugin for es_runway_selector"

[[bin]]
name = "area_enor"
path = "src/main.rs"

[dependencies]
runway_plugin_api = { workspace = true }

axum = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
runway_selector_area_config = { workspace = true }
runway_selector_plugin_host = { workspace = true }
semver = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
